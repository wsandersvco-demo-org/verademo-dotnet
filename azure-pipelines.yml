trigger:
  - main
  - develop
  - feature/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: SRCCLR_SCA_AGENT
  - group: VERACODE_API_CREDENTIALS
  - name: VERACODE_POLICY_NAME
    value: 'Veracode Recommended Very High'

stages:
  - stage: Build
    displayName: 'Build & Package'
    jobs:
      - job: DoBuild
        displayName: 'Build with Auto-Packager'
        steps:
          - checkout: self
            displayName: 'Checkout code'

          - task: UseDotNet@2
            displayName: 'Setup .NET 8'
            inputs:
              version: '8.0.x'

          - script: |
              curl -fsS https://tools.veracode.com/veracode-cli/install | sh
            displayName: 'Install Veracode CLI'
            env:
              VERACODE_API_KEY_ID: $(VERACODE_API_ID)
              VERACODE_API_KEY_SECRET: $(VERACODE_API_KEY)

          - script: |
              ./veracode package \
                --source . \
                --output veracode-artifacts \
                --trust
            displayName: 'Package artifacts with auto-packager'
            env:
              VERACODE_API_KEY_ID: $(VERACODE_API_ID)
              VERACODE_API_KEY_SECRET: $(VERACODE_API_KEY)

          - task: PublishBuildArtifacts@1
            displayName: 'Publish packaged artifacts'
            inputs:
              PathtoPublish: './veracode-artifacts'
              ArtifactName: 'packaged-artifacts'
            condition: succeeded()

  - stage: Scan
    displayName: 'Security Scans'
    dependsOn: Build
    jobs:
      - job: StaticScan
        displayName: 'Veracode Static Scan'
        steps:
          - checkout: self
            displayName: 'Checkout code'

          - task: DownloadBuildArtifacts@0
            displayName: 'Download packaged artifacts'
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'packaged-artifacts'
              downloadPath: '$(Agent.BuildDirectory)/artifacts'

          - script: |
              curl -fsS https://tools.veracode.com/veracode-cli/install | sh
            displayName: 'Install Veracode CLI'
            env:
              VERACODE_API_KEY_ID: $(VERACODE_API_ID)
              VERACODE_API_KEY_SECRET: $(VERACODE_API_KEY)

          - script: |
              mkdir -p "$(Build.ArtifactStagingDirectory)/veracode-results"
              ./veracode policy get "$(VERACODE_POLICY_NAME)" --format json
            displayName: 'Fetch policy configuration'
            env:
              VERACODE_API_KEY_ID: $(VERACODE_API_ID)
              VERACODE_API_KEY_SECRET: $(VERACODE_API_KEY)

          - script: |
              set -e
              ARTIFACTS_DIR="$(Agent.BuildDirectory)/artifacts"
              RESULTS_DIR="$(Build.ArtifactStagingDirectory)/veracode-results"
              ZIP_FILES=($(find "$ARTIFACTS_DIR" -maxdepth 1 -name "*.zip" -type f | sort))

              if [ ${#ZIP_FILES[@]} -eq 0 ]; then
                echo "##vso[task.logissue type=error]No artifact files found"
                exit 1
              fi

              echo "Found ${#ZIP_FILES[@]} artifact(s) to scan"

              # Run scans in parallel using subshells and wait for all
              declare -a PIDS
              declare -a FAILURES

              for ARTIFACT_FILE in "${ZIP_FILES[@]}"; do
                FILENAME=$(basename "$ARTIFACT_FILE" .zip)
                (
                  echo "Starting scan for: $ARTIFACT_FILE"
                  ./veracode static scan \
                    --policy-file "$(VERACODE_POLICY_NAME).json" \
                    --results-file "$RESULTS_DIR/${FILENAME}-results.json" \
                    --filtered-json-output-file "$RESULTS_DIR/${FILENAME}-filtered-results.json" \
                    "$ARTIFACT_FILE"
                  SCAN_EXIT=$?
                  if [ $SCAN_EXIT -eq 3 ]; then
                    echo "Policy violations found for $FILENAME (exit code 3)"
                    exit 3
                  elif [ $SCAN_EXIT -gt 3 ]; then
                    echo "Scan failed for $FILENAME with exit code $SCAN_EXIT"
                    exit $SCAN_EXIT
                  else
                    echo "Scan completed successfully for $FILENAME (exit code $SCAN_EXIT)"
                    exit 0
                  fi
                ) &
                PIDS+=($!)
              done

              # Wait for all background jobs and collect exit codes
              ANY_POLICY_VIOLATIONS=0
              ANY_FAILURES=0
              for i in "${!PIDS[@]}"; do
                wait ${PIDS[$i]}
                EXIT_CODE=$?
                FILENAME=$(basename "${ZIP_FILES[$i]}" .zip)
                if [ $EXIT_CODE -eq 0 ]; then
                  echo "Scan completed successfully for $FILENAME"
                elif [ $EXIT_CODE -eq 1 ]; then
                  echo "##vso[task.logissue type=warning]$FILENAME: No modules found in artifact (exit code 1)"
                elif [ $EXIT_CODE -eq 3 ]; then
                  echo "##vso[task.logissue type=warning]$FILENAME: Policy violations found"
                  ANY_POLICY_VIOLATIONS=1
                elif [ $EXIT_CODE -gt 3 ]; then
                  echo "##vso[task.logissue type=error]$FILENAME: Scan failed with exit code $EXIT_CODE"
                  ANY_FAILURES=1
                fi
              done

              if [ $ANY_FAILURES -eq 1 ]; then
                exit 1
              elif [ $ANY_POLICY_VIOLATIONS -eq 1 ]; then
                exit 3
              fi
            displayName: 'Run parallel Veracode static scans'
            env:
              VERACODE_API_KEY_ID: $(VERACODE_API_ID)
              VERACODE_API_KEY_SECRET: $(VERACODE_API_KEY)
            continueOnError: false

          - task: PublishBuildArtifacts@1
            displayName: 'Publish static scan results'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/veracode-results'
              ArtifactName: 'static-scan-results'
            condition: succeededOrFailed()
      - job: SCAScan
        displayName: 'SCA Agent Scan'
        steps:
          - checkout: self
            displayName: 'Checkout code'

          - script: |
              mkdir -p "$(Build.ArtifactStagingDirectory)/veracode-results"
              curl -sSL https://download.sourceclear.com/ci.sh | sh -s -- scan . --recursive --allow-dirty --json "$(Build.ArtifactStagingDirectory)/veracode-results/sca-results.json"
            displayName: 'Run SCA agent scan'
            env:
              SRCCLR_API_TOKEN: $(SRCCLR_API_TOKEN)
            continueOnError: true

          - task: PublishBuildArtifacts@1
            displayName: 'Publish SCA scan results'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/veracode-results'
              ArtifactName: 'sca-scan-results'
            condition: succeededOrFailed()

